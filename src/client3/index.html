<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Determine the application's base URL from the current browser location.
      // For example, /tightblog/tb-ui/app/register becomes /tightblog/tb-ui/.
      (() => {
          const uiPath = '/tb-ui/'
          const markerIndex = window.location.pathname.lastIndexOf(uiPath)
          const contextPath =
              markerIndex >= 0 ? window.location.pathname.slice(0, markerIndex) : ''

          const baseElement = document.createElement('base')
          baseElement.href = `${contextPath}${uiPath}`
          document.head.appendChild(baseElement)
      })()
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" media="all" href="./styles/tbeditorui.css" />
    <link rel="stylesheet" media="all" href="./styles/colors.css" />
    <title>TightBlog</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- modal-div for Vue teleport feature https://vueschool.io/lessons/vue-3-teleport -->
    <div id="modal-div"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
